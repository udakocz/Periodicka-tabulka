<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Chemické kartičky</title>
  <meta name="theme-color" content="#6d5dfc" />
  <style>
    :root{--bg1:#eef4ff;--bg2:#f9fbff;--accent:#6d5dfc;--accent2:#4f46e5;--accent3:#60a5fa;--text:#101828;--muted:#6b7280;--card:rgba(255,255,255,.84);--line:rgba(255,255,255,.65);--shadow:0 22px 60px rgba(49,56,102,.16);--green:#10b981}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;display:grid;place-items:center;padding:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 16%,rgba(109,93,252,.18),transparent 28%),radial-gradient(circle at 86% 20%,rgba(96,165,250,.16),transparent 25%),radial-gradient(circle at 80% 90%,rgba(16,185,129,.10),transparent 24%),linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden}
    .bg-blur{position:fixed;inset:0;pointer-events:none;overflow:hidden}.blob{position:absolute;border-radius:999px;filter:blur(40px);opacity:.35;animation:drift 11s ease-in-out infinite alternate}.b1{width:170px;height:170px;background:#7c3aed;left:-30px;top:90px}.b2{width:150px;height:150px;background:#60a5fa;right:-25px;top:190px;animation-delay:-2s}.b3{width:170px;height:170px;background:#34d399;left:40%;bottom:0;animation-delay:-5s}@keyframes drift{from{transform:translateY(-8px) translateX(0) scale(1)}to{transform:translateY(14px) translateX(10px) scale(1.07)}}
    .app{width:min(100%,470px);position:relative;z-index:1}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;box-shadow:0 10px 25px rgba(79,70,229,.25);font-size:22px;flex:0 0 auto}.titles h1{margin:0;font-size:26px;line-height:1.05;font-weight:900;letter-spacing:-.04em}.titles p{margin:4px 0 0;color:var(--muted);font-size:13px}.music-btn{border:0;border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow);color:var(--accent2);font-weight:800;cursor:pointer;white-space:nowrap}
    .card{position:relative;overflow:hidden;min-height:500px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);padding:24px}.card::before{content:"";position:absolute;right:-75px;top:-75px;width:170px;height:170px;border-radius:50%;background:linear-gradient(135deg,rgba(109,93,252,.16),rgba(96,165,250,.10))}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.chip{border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:#4f46e5;background:#eef2ff;border:1px solid rgba(99,102,241,.10)}.chip.green{color:#047857;background:#ecfdf5;border-color:rgba(16,185,129,.12)}.prompt{color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:900;text-align:center;margin:12px 0 16px}.formula-wrap{min-height:142px;display:flex;align-items:center;justify-content:center}.formula{margin:0;font-size:88px;line-height:1;font-weight:950;letter-spacing:-.06em;transition:opacity .16s ease,transform .16s ease}.formula.changing{opacity:0;transform:translateY(8px) scale(.975)}.answer-area{min-height:88px;display:flex;align-items:center;justify-content:center;margin:8px 0 22px}.name{font-size:32px;font-weight:900;letter-spacing:-.03em;opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease;text-align:center}.name.visible{opacity:1;transform:none}.controls{display:grid;gap:10px;margin-top:4px}button.action{width:100%;min-height:58px;border:0;border-radius:18px;font-size:17px;font-weight:900;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease;-webkit-tap-highlight-color:transparent}button.action:active{transform:scale(.987)}.primary{color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 14px 30px rgba(79,70,229,.25)}.secondary{display:none;color:#3730a3;background:#f3f4ff;border:1px solid rgba(79,70,229,.10)}.secondary.show{display:block}.bottom{margin-top:16px;display:flex;align-items:center;gap:10px}.progress{flex:1;height:8px;border-radius:999px;overflow:hidden;background:rgba(99,102,241,.10)}.progress-bar{height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,var(--accent2),var(--accent3));transition:width .2s ease}.counter{min-width:58px;text-align:right;color:var(--muted);font-size:13px;font-weight:800}.hint{margin-top:14px;text-align:center;font-size:13px;color:var(--muted)}
    .celebration{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.celebration.show{display:flex}.cele-card{width:100%;text-align:center;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.85);border-radius:28px;box-shadow:0 24px 60px rgba(49,56,102,.18);padding:28px 22px 22px;position:relative;overflow:hidden}.cele-emoji{font-size:56px;line-height:1;margin-bottom:10px}.cele-title{margin:0;font-size:28px;line-height:1.05;font-weight:950;letter-spacing:-.04em}.cele-text{margin:10px 0 18px;color:var(--muted);font-size:15px;line-height:1.45}.restart{color:#fff;background:linear-gradient(135deg,var(--green),#22c55e);box-shadow:0 14px 30px rgba(34,197,94,.22)}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}.piece{position:absolute;width:10px;height:16px;border-radius:4px;top:-20px;animation:fall linear forwards;opacity:.9}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.95}}@media(max-width:480px){body{padding:14px}.titles h1{font-size:23px}.titles p{font-size:12px}.card{min-height:480px;padding:20px}.formula{font-size:76px}.name{font-size:28px}.music-btn{padding:10px 12px;font-size:13px}}
  </style>
</head>
<body>
<div class="bg-blur"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div><div id="confetti" class="confetti"></div>
<main class="app"><div class="topbar"><div class="brand"><div class="logo">🧪</div><div class="titles"><h1>Chemické kartičky</h1><p>Mini procvičování pro 8. třídu</p></div></div><button id="musicBtn" class="music-btn">🎵 Zapnout hudbu</button></div><section class="card"><div class="chips"><div class="chip">17 kartiček</div><div class="chip green">Moderní režim</div></div><div class="prompt">Poznáš to?</div><div class="formula-wrap"><div id="formula" class="formula">H₂O</div></div><div class="answer-area"><div id="name" class="name" aria-live="polite">Voda</div></div><div class="controls"><button id="reveal" class="action primary">Zobrazit název</button><button id="next" class="action secondary">Další kartička →</button></div><div class="bottom"><div class="progress"><div id="progressBar" class="progress-bar"></div></div><div id="counter" class="counter">1 / 17</div></div><div class="hint">Hudba: jemná verze známé skladby Gymnopédie No. 1.</div><div id="celebration" class="celebration"><div class="cele-card"><div class="cele-emoji">😎🎉</div><h2 class="cele-title">Hotovo, hustý!</h2><p class="cele-text">Prošel(a) jsi všech 17 kartiček. Klidně si dej další kolo a zkus si prvky zapamatovat ještě rychleji.</p><button id="restart" class="action restart">Hrát znovu</button></div></div></section></main>
<script>
const cards=[["H₂O","Voda"],["O₂","Kyslík"],["CO₂","Oxid uhličitý"],["H₂","Vodík"],["N₂","Dusík"],["Mg","Hořčík"],["Ca","Vápník"],["Na","Sodík"],["K","Draslík"],["Cu","Měď"],["Sn","Cín"],["Fe","Železo"],["Zn","Zinek"],["Pb","Olovo"],["Hg","Rtuť"],["S","Síra"],["Au","Zlato"]];
let deck=[],index=0,transitioning=false,completed=false;const formulaEl=document.getElementById("formula"),nameEl=document.getElementById("name"),revealBtn=document.getElementById("reveal"),nextBtn=document.getElementById("next"),counterEl=document.getElementById("counter"),progressBar=document.getElementById("progressBar"),celebrationEl=document.getElementById("celebration"),restartBtn=document.getElementById("restart"),confettiEl=document.getElementById("confetti"),musicBtn=document.getElementById("musicBtn");
let audioCtx=null,musicOn=false,musicTimer=null,musicPos=0;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}
function softNote(freq,start=0,duration=1,volume=.015){if(!audioCtx)return;const o1=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o1.type="sine";o2.type="triangle";o1.frequency.value=freq;o2.frequency.value=freq*2;f.type="lowpass";f.frequency.value=1200;g.gain.setValueAtTime(.0001,audioCtx.currentTime+start);g.gain.exponentialRampToValueAtTime(volume,audioCtx.currentTime+start+.08);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+start+duration);o1.connect(g);o2.connect(g);g.connect(f);f.connect(audioCtx.destination);o1.start(audioCtx.currentTime+start);o2.start(audioCtx.currentTime+start);o1.stop(audioCtx.currentTime+start+duration+.05);o2.stop(audioCtx.currentTime+start+duration+.05)}
function softChord(notes,start=0,duration=2.8){notes.forEach((n,i)=>softNote(n,start+i*.03,duration,.0055))}
const gymMelody=[
  [392.00,1.2],[440.00,1.2],[493.88,1.2],[523.25,1.2],[493.88,1.2],[440.00,1.2],
  [392.00,1.2],[440.00,1.2],[493.88,1.2],[587.33,1.8],[523.25,1.2],[493.88,1.2],
  [440.00,1.2],[392.00,1.2],[349.23,1.2],[392.00,1.8]
];
const gymChords=[
  [146.83,220.00,293.66],[130.81,196.00,261.63],[146.83,220.00,293.66],[130.81,196.00,261.63]
];
function playMusicStep(){if(!musicOn||!audioCtx)return;const m=gymMelody[musicPos%gymMelody.length];if(musicPos%4===0){const c=gymChords[Math.floor(musicPos/4)%gymChords.length];softChord(c,0,4.6)}softNote(m[0],0,m[1],.010);musicPos++}
function startBackgroundMusic(){if(musicTimer)return;ensureAudio();musicPos=0;playMusicStep();musicTimer=setInterval(playMusicStep,1200)}function stopBackgroundMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function toggleMusic(){ensureAudio();musicOn=!musicOn;musicBtn.textContent=musicOn?"🎵 Hudba zapnutá":"🎵 Zapnout hudbu";musicOn?startBackgroundMusic():stopBackgroundMusic()}
function playRevealSound(){if(!audioCtx)return;softNote(659.25,0,.20,.011);softNote(783.99,.10,.28,.008)}function playCompletionFanfare(){if(!audioCtx)return;[523.25,659.25,783.99,1046.5].forEach((n,i)=>softNote(n,i*.12,.35,.016));softNote(1318.5,.55,.65,.012)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function newDeck(){deck=shuffle(cards);index=0;completed=false}function updateProgress(){counterEl.textContent=`${index+1} / ${deck.length}`;progressBar.style.width=`${((index+1)/deck.length)*100}%`}function setCardInstantly(){const[formula,name]=deck[index];nameEl.classList.remove("visible");nameEl.textContent="";nextBtn.classList.remove("show");revealBtn.style.display="block";formulaEl.textContent=formula;nameEl.textContent=name;updateProgress()}function showCelebration(){completed=true;celebrationEl.classList.add("show");createConfetti();ensureAudio();playCompletionFanfare()}function showNextCard(){if(transitioning||completed)return;transitioning=true;nameEl.classList.remove("visible");nameEl.textContent="";nextBtn.classList.remove("show");revealBtn.style.display="block";formulaEl.classList.add("changing");setTimeout(()=>{if(index>=deck.length-1){formulaEl.classList.remove("changing");transitioning=false;showCelebration();return}index++;const[formula,name]=deck[index];formulaEl.textContent=formula;nameEl.textContent=name;updateProgress();requestAnimationFrame(()=>{formulaEl.classList.remove("changing");transitioning=false})},120)}function restartGame(){celebrationEl.classList.remove("show");confettiEl.innerHTML="";newDeck();setCardInstantly()}function createConfetti(){confettiEl.innerHTML="";const colors=["#6d5dfc","#60a5fa","#34d399","#f59e0b","#f472b6"];for(let i=0;i<80;i++){const p=document.createElement("div");p.className="piece";p.style.left=`${Math.random()*100}%`;p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDuration=`${3+Math.random()*2.4}s`;p.style.animationDelay=`${Math.random()*.5}s`;p.style.transform=`rotate(${Math.random()*360}deg)`;confettiEl.appendChild(p)}setTimeout(()=>confettiEl.innerHTML="",6000)}
musicBtn.addEventListener("click",toggleMusic);revealBtn.addEventListener("click",()=>{ensureAudio();playRevealSound();nameEl.classList.add("visible");revealBtn.style.display="none";nextBtn.classList.add("show")});nextBtn.addEventListener("click",showNextCard);restartBtn.addEventListener("click",restartGame);newDeck();setCardInstantly();
</script>
</body></html>
