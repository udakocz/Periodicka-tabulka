<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chemické kartičky</title><meta name="theme-color" content="#6d5dfc"><style>:root{--a:#6d5dfc;--a2:#4f46e5;--a3:#60a5fa;--t:#101828;--m:#6b7280;--g:#10b981}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;display:grid;place-items:center;padding:18px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--t);background:radial-gradient(circle at 12% 16%,rgba(109,93,252,.18),transparent 28%),radial-gradient(circle at 86% 20%,rgba(96,165,250,.16),transparent 25%),radial-gradient(circle at 80% 90%,rgba(16,185,129,.10),transparent 24%),linear-gradient(160deg,#eef4ff,#f9fbff);overflow-x:hidden}.blob{position:fixed;border-radius:999px;filter:blur(40px);opacity:.3;animation:d 11s ease-in-out infinite alternate;pointer-events:none}.b1{width:170px;height:170px;background:#7c3aed;left:-30px;top:90px}.b2{width:150px;height:150px;background:#60a5fa;right:-25px;top:190px;animation-delay:-2s}.b3{width:170px;height:170px;background:#34d399;left:40%;bottom:0;animation-delay:-5s}@keyframes d{to{transform:translate(10px,14px) scale(1.07)}}.app{width:min(100%,470px);position:relative;z-index:1}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--a3));color:white;font-size:22px;box-shadow:0 10px 25px rgba(79,70,229,.25)}h1{margin:0;font-size:26px;line-height:1.05;font-weight:900;letter-spacing:-.04em}.sub{margin-top:4px;color:var(--m);font-size:13px}.rainbtn{border:0;border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.8);box-shadow:0 14px 35px rgba(49,56,102,.14);color:var(--a2);font-weight:800;cursor:pointer;white-space:nowrap}.card{position:relative;overflow:hidden;min-height:500px;background:rgba(255,255,255,.84);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.65);border-radius:32px;box-shadow:0 22px 60px rgba(49,56,102,.16);padding:24px}.chips{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:#4f46e5;background:#eef2ff}.prompt{text-align:center;color:var(--m);text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:900;margin:28px 0 16px}.wrap{min-height:142px;display:grid;place-items:center}.formula{font-size:88px;line-height:1;font-weight:950;letter-spacing:-.06em;transition:.16s}.formula.changing{opacity:0;transform:translateY(8px) scale(.975)}.answer{min-height:88px;display:grid;place-items:center;margin:8px 0 22px}.name{font-size:32px;font-weight:900;letter-spacing:-.03em;opacity:0;transform:translateY(8px);transition:.2s;text-align:center}.name.visible{opacity:1;transform:none}.controls{display:grid;gap:10px}button.action{width:100%;min-height:58px;border:0;border-radius:18px;font-size:17px;font-weight:900;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,var(--a2),var(--a));box-shadow:0 14px 30px rgba(79,70,229,.25)}.next{display:none;color:#3730a3;background:#f3f4ff;border:1px solid rgba(79,70,229,.1)}.next.show{display:block}.bottom{margin-top:16px;display:flex;align-items:center;gap:10px}.progress{flex:1;height:8px;border-radius:999px;overflow:hidden;background:rgba(99,102,241,.1)}.bar{height:100%;background:linear-gradient(90deg,var(--a2),var(--a3));transition:.2s}.count{min-width:58px;text-align:right;color:var(--m);font-size:13px;font-weight:800}.hint{text-align:center;margin-top:14px;color:var(--m);font-size:13px}.private-stats{display:none;text-align:center;margin-top:8px;color:#8b90a0;font-size:10px;letter-spacing:.02em}.private-stats.show{display:block}.done{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(255,255,255,.74);backdrop-filter:blur(8px)}.done.show{display:flex}.donebox{width:100%;text-align:center;background:white;border-radius:28px;padding:28px 22px;box-shadow:0 24px 60px rgba(49,56,102,.18)}.emoji{font-size:56px}.done h2{font-size:28px;margin:10px 0 6px}.done p{color:var(--m);line-height:1.45}.restart{color:white;background:linear-gradient(135deg,var(--g),#22c55e)}.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}.piece{position:absolute;top:-20px;width:10px;height:16px;border-radius:4px;animation:f linear forwards}@keyframes f{to{transform:translateY(110vh) rotate(540deg)}}@media(max-width:480px){body{padding:14px}h1{font-size:23px}.sub{font-size:12px}.card{min-height:480px;padding:20px}.formula{font-size:76px}.name{font-size:28px}.rainbtn{font-size:13px;padding:10px 12px}}</style></head><body><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div id="confetti" class="confetti"></div><main class="app"><div class="top"><div class="brand"><div class="logo">🧪</div><div><h1>Chemické kartičky</h1><div class="sub">Mini procvičování pro 8. třídu</div></div></div><button id="rainBtn" class="rainbtn">🌧 Zapnout déšť</button></div><section class="card"><div class="chips"><span class="chip">17 kartiček</span></div><div class="prompt">Poznáš to?</div><div class="wrap"><div id="formula" class="formula">H₂O</div></div><div class="answer"><div id="name" class="name">Voda</div></div><div class="controls"><button id="reveal" class="action primary">Zobrazit název</button><button id="next" class="action next">Další kartička →</button></div><div class="bottom"><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="count">1 / 17</div></div><div class="hint">🌧 Jemný déšť na pozadí můžeš kdykoliv zapnout nebo vypnout.</div><div id="privateStats" class="private-stats"></div><div id="done" class="done"><div class="donebox"><div class="emoji">😎🎉</div><h2>Hotovo, hustý!</h2><p>Prošel(a) jsi všech 17 kartiček.</p><button id="restart" class="action restart">Hrát znovu</button></div></div></section></main><script>const cards=[["H₂O","Voda"],["O₂","Kyslík"],["CO₂","Oxid uhličitý"],["H₂","Vodík"],["N₂","Dusík"],["Mg","Hořčík"],["Ca","Vápník"],["Na","Sodík"],["K","Draslík"],["Cu","Měď"],["Sn","Cín"],["Fe","Železo"],["Zn","Zinek"],["Pb","Olovo"],["Hg","Rtuť"],["S","Síra"],["Au","Zlato"]];let deck=[],i=0,busy=false,finished=false;const q=x=>document.getElementById(x),formula=q('formula'),nameEl=q('name'),reveal=q('reveal'),next=q('next'),bar=q('bar'),count=q('count'),done=q('done'),restart=q('restart'),rainBtn=q('rainBtn'),confetti=q('confetti'),privateStats=q('privateStats');function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function newDeck(){deck=shuffle(cards);i=0;finished=false}function progress(){count.textContent=`${i+1} / ${deck.length}`;bar.style.width=`${((i+1)/deck.length)*100}%`}function show(){nameEl.classList.remove('visible');nameEl.textContent='';next.classList.remove('show');reveal.style.display='block';formula.textContent=deck[i][0];nameEl.textContent=deck[i][1];progress()}function celebrate(){finished=true;done.classList.add('show');makeConfetti();playFanfare()}function nextCard(){if(busy||finished)return;busy=true;nameEl.classList.remove('visible');nameEl.textContent='';next.classList.remove('show');reveal.style.display='block';formula.classList.add('changing');setTimeout(()=>{if(i>=deck.length-1){formula.classList.remove('changing');busy=false;celebrate();return}i++;formula.textContent=deck[i][0];nameEl.textContent=deck[i][1];progress();requestAnimationFrame(()=>{formula.classList.remove('changing');busy=false})},120)}reveal.onclick=()=>{nameEl.classList.add('visible');reveal.style.display='none';next.classList.add('show')};next.onclick=nextCard;restart.onclick=()=>{done.classList.remove('show');confetti.innerHTML='';newDeck();show()};function makeConfetti(){const colors=['#6d5dfc','#60a5fa','#34d399','#f59e0b','#f472b6'];for(let n=0;n<80;n++){const p=document.createElement('div');p.className='piece';p.style.left=Math.random()*100+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDuration=3+Math.random()*2.4+'s';p.style.animationDelay=Math.random()*.5+'s';confetti.appendChild(p)}setTimeout(()=>confetti.innerHTML='',6000)}let ctx=null,rainOn=false,rainNodes=[];function ensureAudio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function noiseBuffer(seconds){const b=ctx.createBuffer(2,ctx.sampleRate*seconds,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let smooth=0;for(let n=0;n<d.length;n++){const white=Math.random()*2-1;smooth=.97*smooth+.03*white;d[n]=white*.45+smooth*.55}}return b}function addRainLayer(gain,highpass,lowpass){const src=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),lp=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=noiseBuffer(8);src.loop=true;hp.type='highpass';hp.frequency.value=highpass;lp.type='lowpass';lp.frequency.value=lowpass;g.gain.value=gain;src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(ctx.destination);src.start();rainNodes.push(src,hp,lp,g)}function startRain(){ensureAudio();if(rainNodes.length)return;addRainLayer(.032,350,4200);addRainLayer(.014,1200,7200);addRainLayer(.012,80,1100)}function stopRain(){for(const n of rainNodes){try{if(n.stop)n.stop()}catch(e){}try{n.disconnect()}catch(e){}}rainNodes=[]}rainBtn.onclick=()=>{rainOn=!rainOn;if(rainOn){startRain();rainBtn.textContent='🌧 Déšť zapnutý'}else{stopRain();rainBtn.textContent='🌧 Zapnout déšť'}};function fanfareNote(freq,start,dur,vol){ensureAudio();const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,ctx.currentTime+start);g.gain.exponentialRampToValueAtTime(vol,ctx.currentTime+start+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+start+dur);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+.04)}function playFanfare(){[[523.25,0],[659.25,.12],[783.99,.24],[1046.5,.38]].forEach(([n,s])=>fanfareNote(n,s,.28,.022));fanfareNote(1318.5,.62,.5,.017)}function trackVisit(){const owner=new URLSearchParams(location.search).get('visits')==='K8m4Q2x7';fetch('https://counterapi.com/api/udakocz.github.io/view/periodicka-tabulka',{cache:'no-store'}).then(r=>r.json()).then(data=>{if(owner&&typeof data.value!=='undefined'){privateStats.textContent='Návštěvy: '+Number(data.value).toLocaleString('cs-CZ');privateStats.classList.add('show')}}).catch(()=>{if(owner){privateStats.textContent='Návštěvy: nedostupné';privateStats.classList.add('show')}})}newDeck();show();trackVisit();</script></body></html>
